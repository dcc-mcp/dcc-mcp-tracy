tools:
  - name: get_version
    description: Resolve tracy-capture and return its help/version output. Use before capture to verify the Tracy runtime.
    input_schema: {type: object, properties: {}, additionalProperties: false}
    output_schema: {type: object}
    read_only: true
    destructive: false
    idempotent: true
    execution: sync
    affinity: any
    timeout_hint_secs: 30
    source_file: scripts/get_version.py
  - name: capture_trace
    description: Connect to an already instrumented Tracy client and save a .tracy trace. Tracy instrumentation must be enabled in the target; this tool never injects into an arbitrary process.
    input_schema:
      type: object
      required: [output_file]
      properties:
        output_file: {type: string, minLength: 1, maxLength: 2000}
        address: {type: string, minLength: 1, maxLength: 255, default: 127.0.0.1}
        port: {type: integer, minimum: 1, maximum: 65535}
        seconds: {type: integer, minimum: 1, maximum: 86400}
        memlimit_percent: {type: integer, minimum: 1, maximum: 1000}
        force: {type: boolean, default: false}
        timeout_secs: {type: integer, minimum: 1, maximum: 86400, default: 3600}
      additionalProperties: false
    output_schema: {type: object}
    read_only: false
    destructive: false
    idempotent: false
    execution: async
    affinity: any
    timeout_hint_secs: 86400
    source_file: scripts/capture_trace.py
    next-tools:
      on-success:
        - tracy_analysis__export_csv
      on-failure:
        - dcc_diagnostics__audit_log
