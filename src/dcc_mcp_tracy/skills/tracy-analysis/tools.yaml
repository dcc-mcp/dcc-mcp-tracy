tools:
  - name: export_csv
    description: Export primary Tracy zone statistics from a saved .tracy file into CSV for offline performance triage.
    input_schema:
      type: object
      required: [trace_file, output_file]
      properties:
        trace_file: {type: string, minLength: 1, maxLength: 2000}
        output_file: {type: string, minLength: 1, maxLength: 2000}
        filter_name: {type: string, maxLength: 1000}
        case_sensitive: {type: boolean, default: false}
      additionalProperties: false
    output_schema: {type: object}
    read_only: false
    destructive: false
    idempotent: true
    execution: async
    affinity: any
    timeout_hint_secs: 300
    source_file: scripts/export_csv.py
    next-tools: [tracy_analysis__summarize_csv]
  - name: summarize_csv
    description: Summarize exported Tracy zone statistics and return the highest standard-deviation zones.
    input_schema:
      type: object
      required: [csv_file]
      properties:
        csv_file: {type: string, minLength: 1, maxLength: 2000}
        limit: {type: integer, minimum: 1, maximum: 100, default: 20}
      additionalProperties: false
    output_schema: {type: object}
    read_only: true
    destructive: false
    idempotent: true
    execution: sync
    affinity: any
    timeout_hint_secs: 30
    source_file: scripts/summarize_csv.py
